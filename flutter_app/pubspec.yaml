name: al_furkan_zen_hifz
description: "Al-Furkan Zen Hifz - Distraction-free Quran Memorization and Live Halaqa App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local offline fast storage
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0

  # Background audio and gapless repetition
  just_audio: ^0.10.6
  audio_service: ^0.18.18

  # On-device offline Sherpa-ONNX ASR recitation engine
  recite_quran: ^1.0.5

  # Live audio-only WebRTC rooms for friends
  livekit_client: ^2.9.0

  # Offline astronomical prayer time calculations
  adhan_dart: ^2.0.1

  # Strict full-screen alarms
  alarm: ^5.15.0

  # Cryptographic utilities for client-side LiveKit JWT generation
  crypto: ^3.0.6

  # UI & utilities
  intl: ^0.19.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/quran_script/
    - assets/adhan/
