name: al_furkan
description: "A Flutter application for reading the Holy Quran, tracking prayer times, and managing Islamic practices."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  shared_preferences: ^2.5.3
  gap: ^3.0.1
  get_it: ^8.0.3
  fluentui_system_icons: ^1.1.273
  intl: ^0.20.2
  html: ^0.15.5
  http: ^1.4.0
  archive: ^4.0.5
  dio: ^5.8.0+1
  scrollable_positioned_list: ^0.3.8
  flutter_qiblah: ^3.1.0
  permission_handler: ^12.0.0+1
  geolocator: ^14.0.0
  vector_math: ^2.1.4
  geocoding: ^4.0.0
  flutter_svg: ^2.0.10+1
  qcf_quran:
    path: packages/qcf_quran_with_update
  vibration: ^3.1.3
  just_audio: ^0.10.3
  just_audio_media_kit: ^2.1.0
  just_audio_background: ^0.0.1-beta.17
  audio_video_progress_bar: ^2.0.3
  dartx: ^1.2.0
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  flutter_html: ^3.0.0
  visibility_detector: ^0.4.0+2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  screenshot: ^3.0.0
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  simple_icons: ^14.6.1
  uuid: ^4.5.1
  flex_color_picker: ^3.7.1
  awesome_notifications: ^0.11.0
  wakelock_plus: ^1.3.2
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  google_fonts: ^6.3.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  flutter_native_splash: ^2.4.7
  adhan_dart: ^1.2.0
  hijri: ^3.0.0
  shimmer: ^3.0.0
  image_picker: ^1.2.1
  gal: ^2.3.2
  camera: ^0.11.4
  sensors_plus: ^7.0.0
  percent_indicator: ^4.2.5

  flutter_screenutil: ^5.9.3
  home_widget: ^0.7.0
  workmanager: ^0.9.0+3
  file_picker: ^10.0.0
  auto_size_text: ^3.0.0
  window_manager: ^0.5.1
  flutter_compass_v2: ^1.0.3

  # ═══════════════════════════════════════════════
  # ADMIN SYSTEM — Firebase & Dependencies
  # ═══════════════════════════════════════════════
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.7
  firebase_auth: ^5.5.7

  timeago: ^3.7.1
  googleapis_auth: ^1.6.0
  google_sign_in: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.1
  flutter_gen: ^5.10.0
  msix: ^3.16.12
  change_app_package_name: ^1.5.0

dependency_overrides:
  flutter_compass_v2:
    path: packages/flutter_compass_v2_patch

msix_config:
  display_name: "Quran's Tafsir, Audio and Prayer"
  publisher_display_name: "IDRISIUM Corp"
  identity_name: com.idrisium.alquran
  publisher: "CN=B9F6AC9B-F4A4-426C-9C75-82E3872E24AB"
  msix_version: 3.8.0.0
  logo_path: "assets/img/Quran_Logo_v3.png"
  capabilities: "internetClient, location"
  store: true


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/img/Quran_Logo_v3.png
    - assets/img/Quran_Logo_v3.jpg
    - assets/img/madina.jpeg
    - assets/img/makkah.jpg
    - assets/img/gmail.svg
    - assets/img/sajadah.png
    - assets/img/kaaba_10171102.png
    - assets/img/masjid-al-nabawi_16183907.png
    - assets/img/adjust-horizontal-settings-svgrepo-com.svg
    - assets/img/empty-folder-svgrepo-com.svg
    - assets/img/kaaba.svg
    - assets/img/sunrise_forbidden_time.png
    - assets/img/noon_forbidden_time.png
    - assets/img/sunset_forbidden_time.png
    - assets/dev/dev image.jpg
    - assets/wahy/json/azkar.json
    - assets/wahy/json/Tafseer_Al_Saddi.json
    - assets/quran_script/
    - assets/meta_data/
    - assets/fonts/google_fonts/

  fonts:
    - family: QPC_Hafs
      fonts:
        - asset: assets/fonts/Quran/QPC Hafs font.ttf

    - family: AlQuranNeov5x1
      fonts:
        - asset: assets/fonts/Quran/AlQuranNeov5x1.ttf

    - family: IndopakNastaleeq
      fonts:
        - asset: assets/fonts/Quran/Indopak Nastaleeq font.ttf
    - family: surah-name-v1
      fonts:
        - asset: assets/fonts/Quran/surah-name-v1.ttf


    - family: KFGQPC-Uthmanic-HAFS-Regular
      fonts:
        - asset: assets/fonts/Quran/KFGQPC Uthmanic Script HAFS Regular.otf

    - family: me_quran_volt_newmet
      fonts:
        - asset: assets/fonts/Quran/me_quran_volt_newmet.ttf

    - family: NotoSans
      fonts:
        - asset: assets/fonts/App/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/App/NotoSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/App/NotoSans-Light.ttf
          weight: 300
        - asset: assets/fonts/App/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/App/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/App/NotoSans-SemiBold.ttf
          weight: 600

    - family: Cairo-Black
      fonts:
        - asset: assets/fonts/App/Cairo-Black.ttf
          weight: 900

    - family: Cairo-Bold
      fonts:
        - asset: assets/fonts/App/Cairo-Bold.ttf
          weight: 700

    - family: Cairo-SemiBold
      fonts:
        - asset: assets/fonts/App/Cairo-SemiBold.ttf
          weight: 600

    - family: Cairo-Regular
      fonts:
        - asset: assets/fonts/App/Cairo-Regular.ttf
          weight: 400

    - family: Cairo-Light
      fonts:
        - asset: assets/fonts/App/Cairo-Light.ttf
          weight: 300

icons_launcher:
  image_path: "assets/img/Quran_Logo_v3.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    web:
      enable: true
    macos:
      enable: true
      image_path: "assets/img/Quran_Logo_v3.png"

    windows:
      enable: false
      image_path: "assets/img/Quran_Logo_v3.png"

    linux:
      enable: true
      image_path: "assets/img/Quran_Logo_v3.png"


flutter_native_splash:
  color: "#ffffff"
  image: assets/img/Quran_Logo_v3.png
  color_dark: "#121212"
  image_dark: assets/img/Quran_Logo_v3.png

  android_12:
    image: assets/img/Quran_Logo_v3.png
    icon_background_color: "#ffffff"
    image_dark: assets/img/Quran_Logo_v3.png
    icon_background_color_dark: "#121212"
